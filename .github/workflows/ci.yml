name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # @insurimple/contracts carries the compliance invariants (indicative vs firm,
        # quoted ⟹ premium, and the no-bind assertion) — these must stay green.
        run: pnpm test

      - name: Build
        # apps/bms builds against the mock spine (no INSURIMPLE_API_URL), so CI needs no backend.
        run: pnpm build
